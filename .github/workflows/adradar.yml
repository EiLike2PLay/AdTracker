name: AdRadar daily sweep

# Sweeps each competitor's Meta Ad Library twice a day (08:00 + 20:00 UTC),
# diffs against the committed snapshot, and pushes validated (winner/rising)
# ads to Slack/Discord. The updated snapshot is committed back so the next
# run can compute a real diff. Reach history is deduped per calendar date
# (see index.ts), so running twice a day does not distort the "N consecutive
# days" rising confirmation into "N runs".

on:
  schedule:
    - cron: "0 8,20 * * *" # 08:00 and 20:00 UTC every day
  workflow_dispatch: {} #  …or trigger it by hand from the Actions tab

permissions:
  contents: write # required to commit the updated snapshot back to the repo

# Never let two sweeps race on the same snapshot files.
concurrency:
  group: adradar-sweep
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    strategy:
      # Don't let one competitor's failure abort the others.
      fail-fast: false
      # One snapshot file per page id is committed sequentially.
      max-parallel: 1
      matrix:
        include:
          - page: "121135054419977" # Korean Skincare Reviews
            country: "ALL"
          - page: "1014965211696273" # Nuria
            country: "FR"
          - page: "683748144815985" # Saeskyn
            country: "ALL"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # --ignore-scripts skips the postinstall Playwright download here; we
        # install Chromium explicitly in the next step with the OS deps.
        run: npm ci --ignore-scripts

      - name: Install Chromium (with system deps)
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Sweep page ${{ matrix.page }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL_NEW_PRODUCTS: ${{ secrets.DISCORD_WEBHOOK_URL_NEW_PRODUCTS }}
        run: |
          node dist/index.js \
            --page-id "${{ matrix.page }}" \
            --data "data/${{ matrix.page }}.json" \
            --country ${{ matrix.country }} \
            --winner-days 7 \
            --min-reach-per-day 2000 \
            --new-ad-max-age 7 \
            --rising-confirm-days 3 \
            --target-countries "France,Germany,Netherlands,Belgium,Italy,Spain"

      - name: Commit updated snapshot
        run: |
          git config user.name  "adradar-bot"
          git config user.email "adradar@users.noreply.github.com"
          git add -f "data/${{ matrix.page }}.json"
          if git diff --cached --quiet; then
            echo "No snapshot changes for ${{ matrix.page }} — nothing to commit."
          else
            git commit -m "chore(adradar): update snapshot for ${{ matrix.page }}"
            # Rebase-pull guards against the previous matrix leg's push.
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
